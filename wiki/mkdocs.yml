# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: Commands++ Wiki
site_url: https://jeanmajid.github.io/MCPE-Commands-plus-plus/
repo_url: https://github.com/jeanmajid/MCPE-Commands-plus-plus
repo_name: jeanmajid/MCPE-Commands-plus-plus
plugins:
    - search
    - awesome-nav:
          filename: .nav.yml
    - git-revision-date-localized:
          enable_creation_date: true
    - git-committers:
          repository: jeanmajid/MCPE-Commands-plus-plus
          branch: main
          docs_path: wiki/docs/
theme:
    logo: logo.png
    favicon: logo.png
    features:
        - navigation.tabs
    name: material
    palette:
        - scheme: slate
          toggle:
              icon: material/brightness-7
              name: Switch to light mode
          primary: black
          accent: indigo

        - scheme: default
          toggle:
              icon: material/brightness-4
              name: Switch to dark mode
extra_css:
    - css/extra.css
