# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: Commands++ Wiki
repo_url: https://github.com/jeanmajid/MCPE-Commands-plus-plus
repo_name: jeanmajid/MCPE-Commands-plus-plus
plugins:
    - search
    - git-revision-date-localized:
          enable_creation_date: true
    - git-committers:
          repository: jeanmajid/MCPE-Commands-plus-plus
          branch: main
          docs_path: wiki/docs/
theme:
    logo: logo.png
    favicon: logo.png
    features:
        - navigation.tabs
    name: material
    palette:
        - scheme: slate
          toggle:
              icon: material/brightness-7
              name: Switch to light mode
          primary: black
          accent: indigo

        - scheme: default
          toggle:
              icon: material/brightness-4
              name: Switch to dark mode
nav:
    - Getting Started: gettingStarted/index.md
    - Commands: commands/index.md
    - Attributes: attributes/index.md
    - Game Rules: gameRules/index.md
    - Contributing: contributing/index.md
extra_css:
    - css/extra.css
